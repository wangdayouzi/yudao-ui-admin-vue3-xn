<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="keywords"
      content="熙宁管理系统，宁波熙宁生物检测有限公司&上海精翰生物科技有限公司内部系统"
    />
    <meta
      name="description"
      content="熙宁管理系统 宁波熙宁生物检测有限公司&上海精翰生物科技有限公司内部系统"
    />
    <title>%VITE_APP_TITLE%</title>
    <!-- 钉钉 H5 远程调试工具 -->
    <script src="https://g.alicdn.com/code/npm/@ali/dingtalk-h5-remote-debug/0.1.3/index.js"></script>
  </head>
  <body>
    <div id="app">
      <style>
        .app-loading {
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #fff;
          color: #303133;
          font-family: 'Microsoft YaHei UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }

        .app-loading-wrap {
          display: flex;
          align-items: center;
          flex-direction: column;
          padding: 24px;
          text-align: center;
        }

        .app-loading-cat {
          display: block;
          width: min(250px, 70vw);
          height: auto;
        }

        .app-loading-title {
          margin: 20px 0 0;
          font-size: 18px;
          font-weight: 600;
          line-height: 1.5;
          letter-spacing: 1px;
        }

        .app-loading-description {
          margin: 8px 0 0;
          color: #909399;
          font-size: 13px;
          line-height: 1.5;
        }
      </style>
      <div class="app-loading" role="status" aria-live="polite">
        <div class="app-loading-wrap">
          <img src="/loading-cat.gif" class="app-loading-cat" width="500" height="295" alt="" />
          <div class="app-loading-title">%VITE_APP_TITLE%</div>
          <p class="app-loading-description">正在加载，请稍候…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
